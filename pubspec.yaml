name: explore
description: The Adityas chart explorer.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  arrow_options:
    git:
      url: https://github.com/ninthhousestudios/arjuna
      ref: bc3f5b43f41da8e5b4b95b8c9c63e2895472ebe7
      path: arrow/options
  arrow_swe:
    git:
      url: https://github.com/ninthhousestudios/arjuna
      ref: bc3f5b43f41da8e5b4b95b8c9c63e2895472ebe7
      path: arrow/swe
  arrow_core:
    git:
      url: https://github.com/ninthhousestudios/arjuna
      ref: bc3f5b43f41da8e5b4b95b8c9c63e2895472ebe7
      path: arrow/core
  arrow_calc:
    git:
      url: https://github.com/ninthhousestudios/arjuna
      ref: bc3f5b43f41da8e5b4b95b8c9c63e2895472ebe7
      path: arrow/calc
  charts_dart:
    git:
      url: https://github.com/ninthhousestudios/charts_dart
  swisseph_rs: ^0.3.1
  web: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.4
  file_picker: ^12.0.0
  flutter_svg: ^2.0.17
  http: ^1.6.0
  supabase_flutter: ^2.15.0
  sentry_flutter: ^9.22.0
  pdf: ^3.13.0
  vector_math: ^2.2.0
  gpt_markdown: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/beings/
    - assets/images/emblems/
    - assets/images/planets/
    - assets/ephe/
    - assets/glyphs/
    - assets/glyphs/beings/
    - assets/glyphs/planets/
    - assets/text/
    - assets/fonts/
  fonts:
    # Brand heading face (SIL OFL, see assets/fonts/Cormorant-OFL.txt). Applied
    # to Aditya names and headings in light mode via the serifFamily token.
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.otf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Medium.otf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.otf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.otf
          weight: 700
