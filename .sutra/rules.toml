# .sutra/rules.toml — Architectural constraints for explore
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise

# ═══════════════════════════════════════════════════════════════════
# Layer boundaries
# ═══════════════════════════════════════════════════════════════════
# astro/ is the calculation engine, api/ is external services,
# ui/ is presentation. Dependencies flow downward only.

[[constraint]]
kind = "forbidden_dep"
from = "lib/astro/**"
to = "lib/ui/**"
name = "astro-no-ui"
severity = "blocking"
provenance = "adopt:explore"

[[constraint]]
kind = "forbidden_dep"
from = "lib/api/**"
to = "lib/ui/**"
name = "api-no-ui"
severity = "blocking"
provenance = "adopt:explore"

[[constraint]]
kind = "forbidden_dep"
from = "lib/ui/**"
to = "lib/astro/swe*.dart"
name = "ui-no-raw-swe"
severity = "blocking"
provenance = "doc:docs/chart-wheel.md"
# UI must go through chart_calculator, not raw Swiss Ephemeris.

# ═══════════════════════════════════════════════════════════════════
# Cycle prevention
# ═══════════════════════════════════════════════════════════════════

[[constraint]]
kind = "no_cycles"
scope = "lib/api/"
name = "api-no-cycles"
severity = "blocking"
provenance = "adopt:explore"

# ═══════════════════════════════════════════════════════════════════
# Fan-in limits
# ═══════════════════════════════════════════════════════════════════

[[constraint]]
kind = "max_fan_in"
target = "lib/astro/being_uncertainty.dart"
threshold = 12
name = "being-uncertainty-fan-in"
severity = "advisory"
provenance = "adopt:explore"
# Domain logic hub (current fan-in 9). Catch scope creep.

# ═══════════════════════════════════════════════════════════════════
# Forbidden patterns (vidhi/language-rules/dart.toml)
# ═══════════════════════════════════════════════════════════════════

[[constraint]]
kind = "forbidden_pattern"
language = "dart"
query = '((comment) @match (#match? @match "^//+ *ignore(_for_file)?:"))'
name = "no-ignore-comments"
severity = "blocking"
scope = "lib/"
provenance = "house analysis_options.yaml baseline"
